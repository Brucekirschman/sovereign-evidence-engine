function makeZip(files){

async function handleFiles(list){

            let txt=await zip.files['manifest.json'].async('string'); let man=JSON.parse(txt);
            if(man.items){ for(let old of man.items){ if(!old.t)continue; if(old.t.startsWith('CAM/')||old.t.startsWith('UNZIPPED')||old.t.startsWith('UNZIPPING')||old.t.startsWith('IMPORTED')||old.t.startsWith('MINTED')||old.t.startsWith('SCAN'))continue; if(items.find(x=>x.ts===old.ts&&x.t===old.t))continue; items.push({ts:old.ts||ts,t:old.t}); } }

                let foundKey=null;
                for(let kk in zip.files){ if(kk.endsWith('/'+evMeta.n) || kk=== 'evidence/'+evMeta.n || kk.split('/').pop()===evMeta.n){ foundKey=kk; break; } }
                if(foundKey){
                  try{
                    let data=await zip.files[foundKey].async('uint8array');
                    let mime=guessMime(evMeta.n);
                    let blob=new Blob([data],{type:mime});
                    let fileObj=new File([blob],evMeta.n,{type:mime});
                    let thumb=null;
                    try{ thumb=await makeThumbBlob(fileObj); }catch(e){ thumb=null; }
                    let thumbUrl = thumb ? thumb.dataUrl : '';
                    // keep full blob for mint, but display thumb only
                    evs.push({n:evMeta.n,safe:sanitizeName(evMeta.n),size:data.length,ts:evMeta.ts||ts,url:thumbUrl,thumbUrl:thumbUrl,_file:fileObj,isImg:true, fullSize:data.length});
                    count++;
                    if(count%5===0){ render(); await new Promise(r=>setTimeout(r,10)); }
                  }catch(e){
                    console.log('ev fail',e);
                  }
                }
              }
            }
          }catch(e){ console.log('manifest fail',e); }
        }else{
          for(let k in zip.files){
            if(k.startsWith('evidence/') && k.indexOf('thumbnails')===-1){
              try{
                let data=await zip.files[k].async('uint8array');
                let name=k.split('/').pop();
                let mime=guessMime(name);
                let blob=new Blob([data],{type:mime});
                let fileObj=new File([blob],name,{type:mime});
                let thumb=null; try{ thumb=await makeThumbBlob(fileObj); }catch(e){}
                let thumbUrl = thumb ? thumb.dataUrl : '';
                evs.push({n:name,safe:sanitizeName(name),size:data.length,ts:ts,url:thumbUrl,thumbUrl:thumbUrl,_file:fileObj,isImg:true, fullSize:data.length});
                count++;
                if(count%5===0){ render(); await new Promise(r=>setTimeout(r,10)); }
              }catch(e){}
            }
          }
        }
        items.push({ts:iso(new Date()),t:'UNZIPPED '+count+' evidence from '+sanitizeName(file.name)}); setGold(100,'UNZIPPED '+count);
      }else{
        let safe=sanitizeName(file.name);
        let thumb=null; try{ thumb=await makeThumbBlob(file); }catch(e){}
        let thumbUrl = thumb ? thumb.dataUrl : '';
        // display thumb only, keep full file handle for mint
        evs.push({n:file.name,safe:safe,size:file.size,ts:ts,url:thumbUrl,thumbUrl:thumbUrl,_file:file,isImg:true, fullSize:file.size});

        items.push({ts:ts,t:'CAM/'+file.name+' '+mb+' MB'+gpsTag});
      }

    let arr=[...new Uint8Array(buf)]; fullHash=arr.map(b=>b.toString(16).padStart(2,'0')).join('');
