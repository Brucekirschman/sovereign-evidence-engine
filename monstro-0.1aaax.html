function floyd(ctx,w,h){var img=ctx.getImageData(0,0,w,h);var d=img.data;for(var i=0;i<d.length;i+=4){var g=(d[i]+d[i+1]+d[i+2])/3;g=(g-128)*1.4+128;d[i]=d[i+1]=d[i+2]=g;}for(var y=0;y<h;y++){for(var x=0;x<w;x++){var idx=(y*w+x)*4;var old=d[idx];var ne=old>128?255:0;var err=old-ne;d[idx]=d[idx+1]=d[idx+2]=ne;if(x+1<w){d[idx+4]+=err*7/16;}if(x>0&&y+1<h){var i2=((y+1)*w+x-1)*4;d[i2]+=err*3/16;}if(y+1<h){var i3=((y+1)*w+x)*4;d[i3]+=err*5/16;}if(x+1<w&&y+1<h){var i4=((y+1)*w+x+1)*4;d[i4]+=err*1/16;}}}ctx.putImageData(img,0,0);}
function qr(cvs,payload){var ctx=cvs.getContext('2d');var W=cvs.width;var sz=12;var cols=Math.floor(W/sz);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,W);ctx.fillStyle='#000';var h=0;for(var i=0;i<payload.length;i++)h=(h*31+payload.charCodeAt(i))>>>0;for(var y=0;y<cols;y++){for(var x=0;x<cols;x++){if((x<7&&y<7)||(x>cols-8&&y<7)||(x<7&&y>cols-8))continue;var v=(h + x*131 + y*313 + payload.charCodeAt((x+y)%payload.length))%3;if(v==0)ctx.fillRect(x*sz,y*sz,sz,sz);}}floyd(ctx,W,W);ctx.fillStyle='#0a3d9c';ctx.fillRect(0,0,7*sz,7*sz);ctx.fillStyle='#fff';ctx.fillRect(sz,sz,5*sz,5*sz);ctx.fillStyle='#000';ctx.fillRect(2*sz,2*sz,3*sz,3*sz);ctx.fillStyle='#0a3d9c';ctx.fillRect(W-7*sz,0,7*sz,7*sz);ctx.fillStyle='#fff';ctx.fillRect(W-6*sz,sz,5*sz,5*sz);ctx.fillStyle='#000';ctx.fillRect(W-5*sz,2*sz,3*sz,3*sz);ctx.fillStyle='#0a3d9c';ctx.fillRect(0,W-7*sz,7*sz,7*sz);ctx.fillStyle='#fff';ctx.fillRect(sz,W-6*sz,5*sz,5*sz);ctx.fillStyle='#000';ctx.fillRect(2*sz,W-5*sz,3*sz,3*sz);}
function getArr(){try{var z=JSON.parse(localStorage.getItem('zithub_v1')||'[]');if(z.length>0)return z;var k=JSON.parse(localStorage.getItem('kidhub_v1')||'[]');return k;}catch(e){try{return JSON.parse(localStorage.getItem('zithub_v1')||'[]');}catch(e2){return [];}}}
function renderZithub(){
var arr=getArr();

document.getElementById('count').textContent=filtered.length+' / '+arr.length;
document.getElementById('empty').style.display=filtered.length?'none':'block';
for(var i=0;i<filtered.length;i++){
var e=filtered[i];
var div=document.createElement('div');var isZit=(e.type||'').toLowerCase().indexOf('zit')!==-1;div.className='card '+(isZit?'zit':'hub');
var meta=document.createElement('div');meta.className='meta';
meta.textContent=(isZit?' ZITCOIN ':' ZITHUB ')+e.hash+' — '+e.time.slice(11,19)+' — '+(e.lang||'');
div.appendChild(meta);
var txt=document.createElement('pre');txt.style.whiteSpace='pre-wrap';txt.style.fontSize='10px';txt.textContent=(e.text||'').slice(0,600);
div.appendChild(txt);

var imgs=h.querySelectorAll('img');
for(var j=0;j<Math.min(imgs.length,2);j++){div.appendChild(imgs[j].cloneNode());}
}

}
}
function pushToHub(type){
try{
var log=document.getElementById('log');
var html=log?log.innerHTML.slice(0,3000):'';
var text=log?log.innerText.slice(0,1000):'';
var entry={type:type,hash:Date.now().toString(16).slice(-7).toUpperCase(),time:new Date().toISOString(),text:text,html:html,lang:LANG,color:COLOR_MODE};
var key='zithub_v1';
var arr=JSON.parse(localStorage.getItem(key)||'[]');arr.unshift(entry);if(arr.length>200)arr=arr.slice(0,200);
localStorage.setItem(key,JSON.stringify(arr));
document.getElementById('genResult').textContent=(type==='zitcoin'?'ZITCOIN ':'ZITHUB ')+entry.hash+' pushed — hit [ZITHUB]';
document.getElementById('btlog').textContent=(type==='zitcoin'?' ZITCOIN ':' ZITHUB ')+entry.hash+' — '+arr.length+' — Bitcoin+GitHub=Zitcoin';
renderZithub();
}catch(e){document.getElementById('genResult').textContent='Push fail: '+e;}
}
